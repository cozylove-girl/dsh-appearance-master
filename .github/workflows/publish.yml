name: publish

# 推送 v 开头的 tag 会触发 npm 发布任务；发布成功还需有效的账户授权与可用版本号。
# 需要先在仓库 Settings → Secrets and variables → Actions 里加一个 NPM_TOKEN
# （npmjs.com → Access Tokens → Granular Access Token，需包发布权限与 bypass 2FA）。
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 让 npm 生成 provenance（可选但推荐）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
